<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Brand display + body faces, used on the public QR scan landing -->
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Back2u — Lost &amp; found, smarter.</title>
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes b2uSplashRise {
          from { opacity: 0; transform: translateY(18px) scale(.97) }
          to { opacity: 1; transform: translateY(0) scale(1) }
        }
        @keyframes b2uSplashOrbit { to { transform: rotate(360deg) } }
        @keyframes b2uSplashPulse {
          0%, 100% { transform: scale(.88); opacity: .34 }
          50% { transform: scale(1); opacity: 1 }
        }
        @keyframes b2uSplashSweep {
          0% { transform: translateX(-115%) }
          55%, 100% { transform: translateX(310%) }
        }
        #b2u-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: grid;
          place-items: center;
          overflow: hidden;
          color: #2E3D2F;
          background:
            radial-gradient(circle at 50% 42%, rgba(126,154,130,.10), transparent 28rem),
            #FFFFFF;
          font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #b2u-splash::before,
        #b2u-splash::after {
          content: "";
          position: absolute;
          width: min(46vw, 560px);
          aspect-ratio: 1;
          border-radius: 50%;
          filter: blur(2px);
          pointer-events: none;
        }
        #b2u-splash::before {
          top: -31vw;
          right: -16vw;
          background: rgba(64,97,74,.06);
          box-shadow: inset 18px 18px 42px rgba(190,198,193,.28), inset -18px -18px 42px #fff;
        }
        #b2u-splash::after {
          bottom: -34vw;
          left: -18vw;
          background: rgba(139,111,78,.055);
        }
        #b2u-splash .stage {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          width: min(88vw, 520px);
          padding: 44px 32px 34px;
          border-radius: 38px 38px 38px 12px;
          background: rgba(255,255,255,.76);
          box-shadow: 20px 20px 46px rgba(190,198,193,.48), -20px -20px 46px #fff;
          animation: b2uSplashRise .65s cubic-bezier(.2,.7,.2,1) both;
          isolation: isolate;
        }
        #b2u-splash .route {
          position: relative;
          width: 150px;
          height: 150px;
          display: grid;
          place-items: center;
          margin-bottom: 25px;
        }
        #b2u-splash .orbit {
          position: absolute;
          inset: 0;
          border: 1px solid rgba(64,97,74,.12);
          border-radius: 50%;
          box-shadow: inset 7px 7px 14px rgba(190,198,193,.38), inset -7px -7px 14px #fff;
        }
        #b2u-splash .orbit::after {
          content: "";
          position: absolute;
          top: 11px;
          left: 50%;
          width: 9px;
          height: 9px;
          margin-left: -4.5px;
          border-radius: 50%;
          background: #8B6F4E;
          box-shadow: 0 0 0 7px rgba(139,111,78,.10);
        }
        #b2u-splash .orbit:first-child { animation: b2uSplashOrbit 5.8s linear infinite }
        #b2u-splash .mark {
          position: relative;
          width: 104px;
          height: 104px;
          display: grid;
          place-items: center;
          border-radius: 50% 50% 50% 22%;
          background: #203126;
          box-shadow: 12px 12px 24px rgba(28,49,36,.25), -10px -10px 22px #fff;
        }
        #b2u-splash .mark svg { width: 59px; height: 59px }
        #b2u-splash .eyebrow {
          margin: 0 0 7px;
          color: #8B6F4E;
          font-size: 11px;
          font-weight: 800;
          letter-spacing: .22em;
          text-transform: uppercase;
        }
        #b2u-splash .wordmark {
          margin: 0;
          color: #203126;
          font-family: "Black Ops One", Georgia, serif;
          font-size: clamp(36px, 8vw, 52px);
          font-weight: 400;
          line-height: 1;
          letter-spacing: -.035em;
        }
        #b2u-splash .promise {
          margin: 12px 0 29px;
          color: rgba(46,61,47,.68);
          font-size: 14px;
          font-weight: 600;
          letter-spacing: .12em;
        }
        #b2u-splash .progress {
          position: relative;
          width: min(100%, 260px);
          height: 6px;
          overflow: hidden;
          border-radius: 99px;
          background: #F3F5F3;
          box-shadow: inset 3px 3px 6px rgba(190,198,193,.52), inset -3px -3px 6px #fff;
        }
        #b2u-splash .progress::after {
          content: "";
          position: absolute;
          inset: 0;
          width: 36%;
          border-radius: inherit;
          background: linear-gradient(90deg, #40614A, #8AA68E);
          box-shadow: 0 0 12px rgba(64,97,74,.34);
          animation: b2uSplashSweep 1.45s ease-in-out infinite;
        }
        #b2u-splash .status {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-top: 14px;
          color: rgba(46,61,47,.52);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: .13em;
          text-transform: uppercase;
        }
        #b2u-splash .status i {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #40614A;
          animation: b2uSplashPulse 1.2s ease-in-out infinite;
        }
        @media (prefers-color-scheme: dark) {
          #b2u-splash { color: #EAF3ED; background: radial-gradient(circle at 50% 42%, rgba(126,154,130,.13), transparent 28rem), #1C231B }
          #b2u-splash .stage { background: rgba(38,48,38,.88); box-shadow: 20px 20px 46px rgba(8,13,8,.62), -16px -16px 40px rgba(58,74,48,.26) }
          #b2u-splash .orbit { border-color: rgba(234,243,237,.08); box-shadow: inset 7px 7px 14px rgba(8,13,8,.56), inset -7px -7px 14px rgba(58,74,48,.26) }
          #b2u-splash .mark { background: #17241B; box-shadow: 12px 12px 24px rgba(8,13,8,.62), -8px -8px 18px rgba(58,74,48,.28) }
          #b2u-splash .wordmark { color: #EAF3ED }
          #b2u-splash .promise { color: rgba(234,243,237,.62) }
          #b2u-splash .progress { background: #202A21; box-shadow: inset 3px 3px 6px rgba(8,13,8,.62), inset -3px -3px 6px rgba(58,74,48,.24) }
          #b2u-splash .status { color: rgba(234,243,237,.48) }
          #b2u-splash::before { background: rgba(126,154,130,.04); box-shadow: none }
        }
        @media (max-width: 520px) {
          #b2u-splash .stage { width: min(88vw, 390px); padding: 36px 24px 29px; border-radius: 30px 30px 30px 10px }
          #b2u-splash .route { width: 132px; height: 132px; margin-bottom: 21px }
          #b2u-splash .mark { width: 92px; height: 92px }
          #b2u-splash .mark svg { width: 53px; height: 53px }
        }
        @media (prefers-reduced-motion: reduce) {
          #b2u-splash .stage, #b2u-splash .orbit:first-child, #b2u-splash .progress::after, #b2u-splash .status i { animation: none }
          #b2u-splash .progress::after { transform: translateX(85%) }
        }
      </style>
      <div id="b2u-splash" role="status" aria-live="polite" aria-label="Back2u is loading">
        <div class="stage">
          <div class="route" aria-hidden="true">
            <span class="orbit"></span>
            <div class="mark">
              <svg viewBox="0 0 48 48" fill="none">
                <defs><linearGradient id="s" x1="8" y1="8" x2="40" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#F4F7F4" /><stop offset="1" stop-color="#A8B5A0" /></linearGradient></defs>
                <path d="M13 12 L13 27 A 11 11 0 0 0 35 27 L35 14.5" stroke="url(#s)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M35 5.5 L29.8 13 L40.2 13 Z" fill="url(#s)" />
                <path d="M24 15.5 c-3.4 0 -6.1 2.7 -6.1 6 c0 4.3 6.1 9.6 6.1 9.6 s6.1 -5.3 6.1 -9.6 c0 -3.3 -2.7 -6 -6.1 -6 z" fill="url(#s)" />
                <circle cx="24" cy="21.5" r="2.4" fill="#203126" />
              </svg>
            </div>
          </div>
          <p class="eyebrow">Ghana's recovery network</p>
          <h1 class="wordmark">Back2u</h1>
          <p class="promise">Lost. Found. Returned.</p>
          <div class="progress" aria-hidden="true"></div>
          <div class="status"><i></i><span>Connecting the community</span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
