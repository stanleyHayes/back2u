<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>bak2me Partner Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes b2uSplashPulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 0.85;
          }
          50% {
            transform: scale(1.08);
            opacity: 1;
          }
        }
        @keyframes b2uSplashSlide {
          from {
            transform: translateX(-100%);
          }
          to {
            transform: translateX(320%);
          }
        }
        #b2u-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 22px;
          background: #1c231b;
        }
        #b2u-splash svg {
          width: 66px;
          height: 66px;
          animation: b2uSplashPulse 1.4s ease-in-out infinite;
        }
        #b2u-splash .bar {
          position: relative;
          width: 120px;
          height: 3px;
          border-radius: 99px;
          overflow: hidden;
          background: rgba(168, 181, 160, 0.18);
        }
        #b2u-splash .bar::after {
          content: '';
          position: absolute;
          inset: 0;
          width: 38%;
          border-radius: 99px;
          background: #a8b5a0;
          animation: b2uSplashSlide 1.1s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          #b2u-splash svg,
          #b2u-splash .bar::after {
            animation: none;
          }
        }
      </style>
      <div id="b2u-splash">
        <svg viewBox="0 0 48 48" fill="none" aria-label="bak2me loading">
          <defs>
            <linearGradient id="s" x1="8" y1="8" x2="40" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#40614A" />
              <stop offset="1" stop-color="#A8B5A0" />
            </linearGradient>
          </defs>
          <path
            d="M13 12 L13 27 A 11 11 0 0 0 35 27 L35 14.5"
            fill="none"
            stroke="url(#s)"
            stroke-width="4.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M35 5.5 L29.8 13 L40.2 13 Z" fill="url(#s)" />
          <g fill="url(#s)">
            <rect x="21.7" y="12.5" width="4.6" height="13" rx="2.3" />
            <path
              d="M17.2 20.8 h13.6 a2.3 2.3 0 0 1 2.3 2.3 v2.7 a5.6 5.6 0 0 1 -5.6 5.6 h-6.9 a5.6 5.6 0 0 1 -5.6 -5.6 v-2.7 a2.3 2.3 0 0 1 2.3 -2.3 z"
            />
            <path d="M17.2 23 a2.6 2.6 0 0 0 -3 1.7 a1.5 1.5 0 0 0 1.1 1.9 l1.9 0.4 z" />
          </g>
        </svg>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
